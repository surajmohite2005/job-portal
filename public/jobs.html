<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/auth.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthAndPopulateNav();
            loadAppliedJobsAndJobs();
        });
    </script>
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-xl sm:text-2xl font-bold text-indigo-600">JobPortal</a>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4" id="navLinks">
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">Find Your Dream Job</h1>
            <p class="text-xl text-gray-600">Discover thousands of opportunities from top companies</p>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Job title, keywords, or company"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    >
                </div>
                <div>
                    <input
                        type="text"
                        id="locationInput"
                        placeholder="Location"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    >
                </div>
                <div>
                    <select id="jobTypeFilter" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="">All Job Types</option>
                        <option value="full-time">Full-time</option>
                        <option value="part-time">Part-time</option>
                        <option value="contract">Contract</option>
                        <option value="internship">Internship</option>
                    </select>
                </div>
                <div>
                    <select id="workModeFilter" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="">All Work Modes</option>
                        <option value="remote">Remote</option>
                        <option value="onsite">On-site</option>
                        <option value="hybrid">Hybrid</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-center">
                <button onclick="searchJobs()" class="bg-indigo-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-300">
                    Search Jobs
                </button>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Available Jobs</h2>
                <p id="jobCount" class="text-gray-600">Loading jobs...</p>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-sm text-gray-600">Sort by:</span>
                <select id="sortBy" onchange="loadJobs()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>
        </div>

        <div id="jobsContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="col-span-full text-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
                <p class="mt-4 text-gray-600">Loading jobs...</p>
            </div>
        </div>

        <div id="pagination" class="flex justify-center items-center space-x-4 hidden">
            <button id="prevBtn" onclick="changePage(-1)" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                Previous
            </button>
            <span id="pageInfo" class="text-gray-600"></span>
            <button id="nextBtn" onclick="changePage(1)" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                Next
            </button>
        </div>
    </main>

    <div id="jobModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
            <div class="p-8">
                <button onclick="closeJobModal()" class="float-right text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>

                <div id="jobDetailContent">
                </div>
            </div>
        </div>
    </div>

    <div id="applicationModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 p-8 relative max-h-[90vh] overflow-y-auto">
            <button onclick="hideApplicationForm()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Apply for Job</h2>
                <p id="applicationJobTitle" class="text-gray-600"></p>
            </div>

            <form id="applicationForm" class="space-y-6">
                <input type="hidden" id="applicationJobId" name="jobId">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="applicantFirstName" class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
                        <input type="text" id="applicantFirstName" name="firstName" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>

                    <div>
                        <label for="applicantLastName" class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
                        <input type="text" id="applicantLastName" name="lastName" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>
                </div>

                <div>
                    <label for="applicantEmail" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="applicantEmail" name="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                </div>

                <div>
                    <label for="applicantPhone" class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
                    <input type="tel" id="applicantPhone" name="phone" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                </div>

                <div>
                    <label for="applicantResume" class="block text-sm font-medium text-gray-700 mb-2">Resume (PDF)</label>
                    <input type="file" id="applicantResume" name="resume" accept=".pdf" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                </div>

                <div>
                    <label for="coverLetter" class="block text-sm font-medium text-gray-700 mb-2">Cover Letter</label>
                    <textarea id="coverLetter" name="coverLetter" rows="4" placeholder="Tell us why you're interested in this position..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"></textarea>
                </div>

                <div>
                    <label for="experience" class="block text-sm font-medium text-gray-700 mb-2">Years of Experience</label>
                    <select id="experience" name="experience" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="">Select experience level</option>
                        <option value="0-1">0-1 years</option>
                        <option value="2-3">2-3 years</option>
                        <option value="4-5">4-5 years</option>
                        <option value="6-10">6-10 years</option>
                        <option value="10+">10+ years</option>
                    </select>
                </div>
                <div id="applicationMessage" class="hidden mt-4 p-3 rounded-lg"></div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-300">
                    Submit Application
                </button>
            </form>
        </div>
    </div>
    
    <script>
        let currentPage = 1;
        let totalPages = 1;
        let currentFilters = {};
        let appliedJobIds = [];

        async function checkAuthAndPopulateNav() {
            try {
                const response = await fetch('/api/me', { credentials: 'include' });
                const navLinks = document.getElementById('navLinks');

                if (response.ok) {
                    const data = await response.json();
                    navLinks.innerHTML = `
                        <a href="/" class="text-gray-700 hover:text-indigo-600 px-2 py-2 rounded-md text-sm font-medium">Home</a>
                        <a href="/jobs" class="text-indigo-600 px-2 py-2 rounded-md text-sm font-medium font-semibold">Jobs</a>
                        <a href="/about" class="text-gray-700 hover:text-indigo-600 px-2 py-2 rounded-md text-sm font-medium">About</a>
                        <a href="/dashboard" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Dashboard</a>
                        <button onclick="logout()" class="text-red-600 hover:text-red-800 px-2 py-2 rounded-md text-sm font-medium">Logout</button>
                    `;
                } else {
                    navLinks.innerHTML = `
                        <a href="/" class="text-gray-700 hover:text-indigo-600 px-2 py-2 rounded-md text-sm font-medium">Home</a>
                        <a href="/jobs" class="text-indigo-600 px-2 py-2 rounded-md text-sm font-medium font-semibold">Jobs</a>
                        <a href="/about" class="text-gray-700 hover:text-indigo-600 px-2 py-2 rounded-md text-sm font-medium">About</a>
                        <a href="/signup" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Sign Up</a>
                    `;
                }
            } catch (error) {
                console.error('Authentication check failed:', error);
            }
        }
        
        async function loadAppliedJobsAndJobs() {
            await loadAppliedJobs();
            await loadJobs();
        }

        async function loadAppliedJobs() {
            try {
                const response = await fetch(`/api/applied-jobs`, { credentials: 'include' });
                if (response.ok) {
                    const data = await response.json();
                    appliedJobIds = data.appliedJobIds || [];
                }
            } catch (error) {
                console.error('Error loading applied jobs:', error);
            }
        }

        async function loadJobs(page = 1) {
            try {
                const sortBy = document.getElementById('sortBy')?.value || 'newest';
                const params = new URLSearchParams({
                    page: page,
                    limit: 10,
                    ...currentFilters,
                });
                if (sortBy === 'oldest') {
                    params.append('sort', 'oldest');
                }

                const response = await fetch(`/api/jobs?${params}`, { credentials: 'include' });
                const data = await response.json();

                if (response.ok) {
                    displayJobs(data.jobs);
                    updatePagination(data.currentPage, data.totalPages, data.total);
                    currentPage = data.currentPage;
                    totalPages = data.totalPages;
                } else {
                    console.error('Error loading jobs:', data.message);
                    document.getElementById('jobsContainer').innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <p class="text-red-600">Error loading jobs. Please try again.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Network error:', error);
                document.getElementById('jobsContainer').innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-red-600">Network error. Please check your connection and try again.</p>
                    </div>
                `;
            }
        }

        function displayJobs(jobs) {
            const container = document.getElementById('jobsContainer');
            if (jobs.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12"><p class="text-gray-600">No jobs found matching your criteria.</p></div>`;
                return;
            }
            container.innerHTML = jobs.map(job => {
                const hasApplied = appliedJobIds.includes(job._id);
                return `<div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition duration-300 cursor-pointer ${hasApplied ? 'border-l-4 border-green-500' : ''}" onclick="showJobDetail('${job._id}')">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center">
                            <img src="${job.companyLogo}" alt="${job.company}" class="w-12 h-12 rounded-lg object-cover mr-4">
                            <div><h3 class="text-xl font-semibold text-gray-900">${job.title}</h3><p class="text-gray-600">${job.company}</p></div>
                        </div>
                        <div class="text-right"><span class="px-3 py-1 bg-green-100 text-green-800 text-sm rounded-full">${job.isActive ? 'Active' : 'Inactive'}</span></div>
                    </div>
                    <div class="mb-4">
                        <div class="flex items-center text-gray-600 mb-2"><svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>${job.location}</div>
                        <div class="flex flex-wrap gap-2 mb-3">
                            <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded">${job.jobType}</span>
                            <span class="px-2 py-1 bg-purple-100 text-purple-800 text-xs rounded">${job.workMode}</span>
                            <span class="px-2 py-1 bg-gray-100 text-gray-800 text-xs rounded">${job.experience}</span>
                        </div>
                    </div>
                    <p class="text-gray-700 mb-4 line-clamp-3">${job.description.substring(0, 150)}...</p>
                    <div class="flex flex-wrap gap-1 mb-4">
                        ${job.skills.slice(0, 3).map(skill => `<span class="px-2 py-1 bg-indigo-100 text-indigo-800 text-xs rounded">${skill}</span>`).join('')}
                        ${job.skills.length > 3 ? `<span class="px-2 py-1 bg-gray-100 text-gray-800 text-xs rounded">+${job.skills.length - 3} more</span>` : ''}
                    </div>
                    <div class="flex justify-between items-center text-sm text-gray-500">
                        <span>Posted: ${new Date(job.createdAt).toLocaleDateString()}</span>
                        <span>Deadline: ${new Date(job.applicationDeadline).toLocaleDateString()}</span>
                    </div>
                    ${hasApplied ? `<div class="mt-4 px-4 py-2 bg-green-50 border border-green-200 rounded-lg"><div class="flex items-center"><svg class="w-4 h-4 text-green-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span class="text-sm font-medium text-green-700">You have applied for this job</span></div></div>` : ''}
                </div>`;
            }).join('');
        }

        function updatePagination(currentPage, totalPages, total) {
            document.getElementById('jobCount').textContent = `${total} jobs found`;
            const paginationEl = document.getElementById('pagination');
            if (totalPages <= 1) {
                paginationEl.classList.add('hidden');
                return;
            }
            paginationEl.classList.remove('hidden');
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= totalPages) {
                loadJobs(newPage);
            }
        }

        function searchJobs() {
            currentFilters = {
                search: document.getElementById('searchInput').value,
                location: document.getElementById('locationInput').value,
                jobType: document.getElementById('jobTypeFilter').value,
                workMode: document.getElementById('workModeFilter').value
            };
            Object.keys(currentFilters).forEach(key => { if (!currentFilters[key]) delete currentFilters[key]; });
            loadJobs(1);
        }

        async function showJobDetail(jobId) {
            try {
                const response = await fetch(`/api/jobs`, { credentials: 'include' });
                const data = await response.json();
                const job = data.jobs.find(j => j._id === jobId);
                if (job) {
                    document.getElementById('jobDetailContent').innerHTML = `
                        <div class="mb-6"><div class="flex items-center mb-4"><img src="${job.companyLogo}" alt="${job.company}" class="w-16 h-16 rounded-lg object-cover mr-4"><div><h2 class="text-3xl font-bold text-gray-900">${job.title}</h2><p class="text-xl text-gray-600">${job.company}</p><p class="text-gray-500">${job.location}</p></div></div><div class="flex flex-wrap gap-2 mb-6"><span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full">${job.jobType}</span><span class="px-3 py-1 bg-purple-100 text-purple-800 rounded-full">${job.workMode}</span><span class="px-3 py-1 bg-gray-100 text-gray-800 rounded-full">${job.experience}</span></div></div>
                        <div class="space-y-6"><div><h3 class="text-xl font-semibold text-gray-900 mb-3">Job Description</h3><p class="text-gray-700 whitespace-pre-line">${job.description}</p></div>
                        <div><h3 class="text-xl font-semibold text-gray-900 mb-3">Requirements</h3><ul class="list-disc list-inside text-gray-700 space-y-1">${job.requirements.map(req => `<li>${req}</li>`).join('')}</ul></div>
                        <div><h3 class="text-xl font-semibold text-gray-900 mb-3">Required Skills</h3><div class="flex flex-wrap gap-2">${job.skills.map(skill => `<span class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full">${skill}</span>`).join('')}</div></div>
                        ${job.benefits && job.benefits.length > 0 ? `<div><h3 class="text-xl font-semibold text-gray-900 mb-3">Benefits</h3><ul class="list-disc list-inside text-gray-700 space-y-1">${job.benefits.map(benefit => `<li>${benefit}</li>`).join('')}</ul></div>` : ''}
                        ${job.salary && (job.salary.min || job.salary.max) ? `<div><h3 class="text-xl font-semibold text-gray-900 mb-3">Salary Range</h3><p class="text-gray-700">${job.salary.min ? `$${job.salary.min.toLocaleString()}` : 'Negotiable'} - ${job.salary.max ? `$${job.salary.max.toLocaleString()}` : 'Negotiable'}</p></div>` : ''}
                        <div class="bg-gray-50 rounded-lg p-4"><div class="flex justify-between items-center text-sm text-gray-600 mb-4"><span>Posted: ${new Date(job.createdAt).toLocaleDateString()}</span><span>Application Deadline: ${new Date(job.applicationDeadline).toLocaleDateString()}</span></div>
                        <button onclick="applyForJob('${job._id}')" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-300">Apply for this Job</button></div></div>`;
                    document.getElementById('jobModal').classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error loading job details:', error);
            }
        }
        
        function closeJobModal() { document.getElementById('jobModal').classList.add('hidden'); }
        async function applyForJob(jobId) {
            const userResponse = await fetch('/api/me', { credentials: 'include' });
            if (userResponse.ok) {
                showApplicationForm(jobId);
            } else {
                alert('Please log in to apply for this job.');
                window.location.href = '/login.html';
            }
        }
        
        async function showApplicationForm(jobId) {
            try {
                const jobCard = document.querySelector(`[onclick="showJobDetail('${jobId}')"]`);
                const jobTitle = jobCard ? jobCard.querySelector('h3').textContent : 'Selected Job';
                document.getElementById('applicationJobTitle').textContent = jobTitle;
                document.getElementById('applicationJobId').value = jobId;
                const userResponse = await fetch('/api/me', { credentials: 'include' });
                if (userResponse.ok) {
                    const userData = await userResponse.json();
                    const [firstName, ...lastNameParts] = userData.user.fullName.split(' ');
                    document.getElementById('applicantFirstName').value = firstName || '';
                    document.getElementById('applicantLastName').value = lastNameParts.join(' ') || '';
                    document.getElementById('applicantEmail').value = userData.user.email;
                }
                document.getElementById('applicationModal').classList.remove('hidden');
            } catch (error) { console.error('Error pre-filling application form:', error); }
        }
        function hideApplicationForm() { document.getElementById('applicationModal').classList.add('hidden'); }
        document.getElementById('jobModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeJobModal(); });
        document.getElementById('applicationModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) hideApplicationForm(); });
        
        document.getElementById('applicationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('jobId', document.getElementById('applicationJobId').value);
            formData.append('firstName', document.getElementById('applicantFirstName').value);
            formData.append('lastName', document.getElementById('applicantLastName').value);
            formData.append('email', document.getElementById('applicantEmail').value);
            formData.append('phone', document.getElementById('applicantPhone').value);
            formData.append('coverLetter', document.getElementById('coverLetter').value);
            formData.append('experience', document.getElementById('experience').value);
            const resumeFile = document.getElementById('applicantResume').files[0];
            if (resumeFile) { formData.append('resume', resumeFile); }

            try {
                const response = await fetch('/api/applications', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                const data = await response.json();
                if (response.ok) {
                    showMessage(document.getElementById('applicationMessage'), 'Application submitted successfully!', 'success');
                    await loadAppliedJobs();
                    setTimeout(() => { hideApplicationForm(); document.getElementById('applicationForm').reset(); window.location.reload(); }, 2000);
                } else { showMessage(document.getElementById('applicationMessage'), data.message || 'Application failed', 'error'); }
            } catch (error) { console.error('Application error:', error); showMessage(document.getElementById('applicationMessage'), 'Network error. Please try again.', 'error'); }
        });
        
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && (e.target.id === 'searchInput' || e.target.id === 'locationInput')) { searchJobs(); }
        });
    </script>
</body>
</html>
