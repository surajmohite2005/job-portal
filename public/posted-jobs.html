<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Posted Jobs - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="/public/auth.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthentication('/login.html').then(user => {
                if (user && user.user.role === 'employer') {
                    loadPostedJobs();
                } else {
                    alert('Access denied. You must be an employer to view this page.');
                    window.location.href = '/dashboard';
                }
            });
        });
    </script>
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-xl sm:text-2xl font-bold text-indigo-600">JobPortal</a>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <a href="/" class="text-gray-700 hover:text-indigo-600 px-2 py-2 rounded-md text-sm font-medium">Home</a>
                    <a href="/dashboard" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Dashboard</a>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800 px-2 py-2 rounded-md text-sm font-medium">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">My Posted Jobs</h1>
            <p class="text-xl text-gray-600">View and manage your job listings and applicants</p>
        </div>

        <div id="postedJobsContainer" class="space-y-6">
            <div class="flex items-center justify-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
            </div>
        </div>
    </main>

    <div id="applicantModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
            <div class="p-8">
                <button onclick="hideApplicantModal()" class="float-right text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
                <div id="applicantModalContent">
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadPostedJobs() {
            const container = document.getElementById('postedJobsContainer');
            try {
                const response = await fetch('/api/my-jobs', { credentials: 'include' });
                const data = await response.json();

                if (response.ok) {
                    if (data.jobs.length > 0) {
                        container.innerHTML = data.jobs.map(job => `
                            <div class="bg-white rounded-lg shadow-lg p-6 flex flex-col md:flex-row items-center justify-between">
                                <div class="flex-1 text-center md:text-left">
                                    <h3 class="text-xl font-bold text-gray-900">${job.title}</h3>
                                    <p class="text-gray-600">${job.company}</p>
                                    <p class="text-sm text-gray-500 mt-1">${job.location} - ${job.jobType}</p>
                                </div>
                                <div class="mt-4 md:mt-0 flex items-center space-x-4">
                                    <span class="inline-flex items-center px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-medium">
                                        Posted: ${new Date(job.createdAt).toLocaleDateString()}
                                    </span>
                                    <button onclick="viewApplicationsForJob('${job._id}')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition duration-300">
                                        View Applications
                                    </button>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        container.innerHTML = `
                            <div class="text-center py-12">
                                <i class="fas fa-plus-circle text-4xl text-gray-400 mb-3"></i>
                                <p class="text-gray-600">You haven't posted any jobs yet.</p>
                                <a href="/dashboard" class="mt-4 text-indigo-600 hover:text-indigo-800 font-medium inline-block">Post a Job</a>
                            </div>
                        `;
                    }
                } else {
                    container.innerHTML = `<p class="text-center text-red-600">Error loading your jobs. Please try again.</p>`;
                }
            } catch (error) {
                console.error('Network error:', error);
                container.innerHTML = `<p class="text-center text-red-600">Network error. Please check your connection.</p>`;
            }
        }

        async function viewApplicationsForJob(jobId) {
            const modalContent = document.getElementById('applicantModalContent');
            modalContent.innerHTML = `
                <div class="text-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
                    <p class="mt-4 text-gray-600">Loading applications...</p>
                </div>
            `;
            document.getElementById('applicantModal').classList.remove('hidden');

            try {
                const response = await fetch(`/api/job-applications/${jobId}`, { credentials: 'include' });
                const data = await response.json();

                if (response.ok) {
                    if (data.applications.length > 0) {
                        modalContent.innerHTML = `
                            <h3 class="text-2xl font-bold mb-4 text-gray-900">Applicants for "${data.job.title}"</h3>
                            <div class="space-y-4">
                                ${data.applications.map(app => `
                                    <div id="app-${app.id}" class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                                        <div class="flex items-start justify-between">
                                            <div>
                                                <h4 class="font-semibold text-gray-900">${app.applicantName}</h4>
                                                <p class="text-sm text-gray-600">${app.email}</p>
                                                <p class="text-xs text-gray-500">Applied on: ${new Date(app.appliedAt).toLocaleDateString()}</p>
                                            </div>
                                            <span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${getStatusBadgeClass(app.status)}">
                                                ${app.status.charAt(0).toUpperCase() + app.status.slice(1)}
                                            </span>
                                        </div>
                                        <div class="mt-4 flex flex-wrap gap-2">
                                            <button onclick="updateApplicationStatus('${app.id}', 'shortlisted')" class="bg-green-100 text-green-800 text-xs px-3 py-1 rounded-full hover:bg-green-200">Shortlist</button>
                                            <button onclick="updateApplicationStatus('${app.id}', 'rejected')" class="bg-red-100 text-red-800 text-xs px-3 py-1 rounded-full hover:bg-red-200">Reject</button>
                                            <button onclick="downloadResume('${app.resumeUrl}')" class="bg-indigo-100 text-indigo-800 text-xs px-3 py-1 rounded-full hover:bg-indigo-200">Download Resume</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    } else {
                        modalContent.innerHTML = `
                            <h3 class="text-2xl font-bold mb-4 text-gray-900">Applicants for "${data.job.title}"</h3>
                            <div class="text-center py-8">
                                <i class="fas fa-user-times text-4xl text-gray-400 mb-3"></i>
                                <p class="text-gray-600">No applications yet for this job.</p>
                            </div>
                        `;
                    }
                } else {
                    modalContent.innerHTML = `<p class="text-center text-red-600">Error loading applications. Please try again.</p>`;
                }
            } catch (error) {
                console.error('Network error:', error);
                modalContent.innerHTML = `<p class="text-center text-red-600">Network error. Please check your connection.</p>`;
            }
        }

        async function updateApplicationStatus(appId, newStatus) {
            try {
                const csrfToken = await getCsrfToken();
                const response = await fetch(`/api/applications/${appId}/status`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    alert('Application status updated successfully!');
                    const appElement = document.getElementById(`app-${appId}`);
                    if (appElement) {
                        const statusBadge = appElement.querySelector('span');
                        statusBadge.textContent = newStatus.charAt(0).toUpperCase() + newStatus.slice(1);
                        statusBadge.className = `px-2.5 py-0.5 rounded-full text-xs font-medium ${getStatusBadgeClass(newStatus)}`;
                    }
                } else {
                    const error = await response.json();
                    alert('Failed to update status: ' + error.message);
                }
            } catch (error) {
                console.error('Error updating status:', error);
                alert('Network error. Failed to update status.');
            }
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case 'shortlisted': return 'bg-green-100 text-green-800';
                case 'rejected': return 'bg-red-100 text-red-800';
                case 'hired': return 'bg-blue-100 text-blue-800';
                case 'reviewing': return 'bg-yellow-100 text-yellow-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function downloadResume(resumeUrl) {
            if (resumeUrl) {
                window.open(resumeUrl, '_blank');
            }
        }

        function hideApplicantModal() {
            document.getElementById('applicantModal').classList.add('hidden');
        }
    </script>
</body>
</html>
