<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - JobPortal</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css)">
    <script src="/auth.js"></script>
    <style>
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="container bg-white p-8 rounded-lg shadow-lg">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Create Account</h1>
            <p class="text-gray-600">Join thousands of job seekers and employers</p>
        </div>
        <form id="signupForm" class="space-y-4">
            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="fullName" name="fullName" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" name="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required minlength="6" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                <p class="mt-1 text-xs text-gray-500">Minimum 6 characters</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">I am a:</label>
                <div class="mt-1 grid grid-cols-2 gap-4">
                    <label class="flex items-center p-3 border border-gray-300 rounded-md cursor-pointer hover:bg-gray-100">
                        <input type="radio" name="role" value="jobseeker" checked class="text-indigo-600 focus:ring-indigo-500">
                        <span class="ml-2 text-sm font-medium text-gray-700">Job Seeker</span>
                    </label>
                    <label class="flex items-center p-3 border border-gray-300 rounded-md cursor-pointer hover:bg-gray-100">
                        <input type="radio" name="role" value="employer" class="text-indigo-600 focus:ring-indigo-500">
                        <span class="ml-2 text-sm font-medium text-gray-700">Employer</span>
                    </label>
                </div>
            </div>
            <div id="message" class="hidden text-sm p-3 rounded-md"></div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md font-semibold hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Create Account
            </button>
        </form>
        <div class="mt-4 text-center">
            <p class="text-sm text-gray-600">
                Already have an account? 
                <a href="/login" class="font-medium text-indigo-600 hover:text-indigo-500">Sign In</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const messageEl = document.getElementById('message');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                // Fetch CSRF token
                let csrfToken;
                try {
                    csrfToken = await getCsrfToken();
                } catch (error) {
                    // Fallback to cookie method
                    csrfToken = getCsrfTokenFromCookie();
                    if (!csrfToken) {
                        throw new Error('Unable to get CSRF token');
                    }
                }

                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-csrf-token': csrfToken,
                        'Accept': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(messageEl, 'Account created successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showMessage(messageEl, result.message || 'Signup failed', 'error');
                }
            } catch (error) {
                console.error('Signup error:', error);
                if (error.message.includes('CSRF token')) {
                    showMessage(messageEl, 'Security token error. Please refresh the page and try again.', 'error');
                } else {
                    showMessage(messageEl, 'Network error. Please try again.', 'error');
                }
            }
        });
    </script>
</body>
</html>
