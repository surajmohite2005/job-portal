<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="/public/auth.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthentication();
        });
    </script>
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-xl sm:text-2xl font-bold text-indigo-600">JobPortal</a>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <a href="/" class="text-gray-700 hover:text-indigo-600 px-2 py-2 rounded-md text-sm font-medium">Home</a>
                    <a href="/dashboard" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Dashboard</a>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800 px-2 py-2 rounded-md text-sm font-medium">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">Upload Resume</h1>
            <p class="text-xl text-gray-600">Keep your professional profile up to date</p>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-6 max-w-2xl mx-auto">
            <form id="resumeForm" class="space-y-6">
                <div>
                    <label for="resumeFile" class="block text-sm font-medium text-gray-700 mb-1">Upload PDF File</label>
                    <input type="file" id="resumeFile" name="resume" accept=".pdf" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                </div>
                <div id="resumeMessage" class="hidden mt-4 p-3 rounded-lg"></div>
                <div class="flex justify-end space-x-4">
                    <a href="/dashboard" class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 font-semibold hover:bg-gray-100">Cancel</a>
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-300">
                        Upload Resume
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('resumeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const messageDiv = document.getElementById('resumeMessage');

            try {
                // This is a placeholder as a dedicated backend update logic is needed.
                // In a real application, you would create a new endpoint, e.g., /api/profile/resume,
                // to handle the file upload for an authenticated user.
                const formData = new FormData(form);
                const csrfToken = await getCsrfToken();
                console.log('Uploading resume:', formData.get('resume').name);

                // Example of a fetch request (currently a placeholder)
                // const response = await fetch('/api/profile/resume', {
                //     method: 'POST',
                //     body: formData,
                //     credentials: 'include',
                //     headers: {
                //        'X-CSRF-Token': csrfToken
                //     }
                // });

                // if (response.ok) {
                //     showMessage(messageDiv, 'Resume uploaded successfully!', 'success');
                //     setTimeout(() => { window.location.href = '/dashboard'; }, 2000);
                // } else {
                //     const error = await response.json();
                //     showMessage(messageDiv, error.message, 'error');
                // }

                showMessage(messageDiv, 'Resume upload functionality is a placeholder. Please implement a dedicated backend endpoint.', 'error');
            } catch (error) {
                console.error('Error uploading resume:', error);
                showMessage(messageDiv, 'Network error. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
