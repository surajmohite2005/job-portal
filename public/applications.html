<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="/public/auth.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthentication().then(user => {
                if (user) {
                    loadApplications();
                }
            });
        });
    </script>
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-xl sm:text-2xl font-bold text-indigo-600">JobPortal</a>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <a href="/" class="text-gray-700 hover:text-indigo-600 px-2 py-2 rounded-md text-sm font-medium">Home</a>
                    <a href="/jobs" class="text-gray-700 hover:text-indigo-600 px-2 py-2 rounded-md text-sm font-medium">Jobs</a>
                    <a href="/dashboard" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Dashboard</a>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800 px-2 py-2 rounded-md text-sm font-medium">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">My Applications</h1>
            <p class="text-xl text-gray-600">Track the status of all your job applications</p>
        </div>

        <div id="applicationsContainer" class="space-y-6">
            <div class="flex items-center justify-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
            </div>
        </div>
    </main>

    <script>
        async function loadApplications() {
            const container = document.getElementById('applicationsContainer');
            try {
                const response = await fetch('/api/my-applications', { credentials: 'include' });
                const data = await response.json();

                if (response.ok) {
                    if (data.applications.length > 0) {
                        container.innerHTML = data.applications.map(app => `
                            <div class="bg-white rounded-lg shadow-lg p-6 border-l-4 ${getStatusBorderClass(app.status)}">
                                <div class="flex items-start justify-between">
                                    <div class="flex-1">
                                        <h3 class="text-xl font-bold text-gray-900">${app.jobTitle}</h3>
                                        <p class="text-gray-600">${app.company}</p>
                                        <p class="text-sm text-gray-500 mt-1">${app.location} - ${app.jobType}</p>
                                    </div>
                                    <div class="ml-4 text-right">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${getStatusBadgeClass(app.status)}">
                                            ${app.status.charAt(0).toUpperCase() + app.status.slice(1)}
                                        </span>
                                        <p class="text-xs text-gray-500 mt-1">Applied: ${new Date(app.appliedAt).toLocaleDateString()}</p>
                                    </div>
                                </div>
                                <div class="mt-4 border-t border-gray-200 pt-4">
                                    <p class="text-sm text-gray-700">Cover Letter: ${app.coverLetter || 'Not provided'}</p>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        container.innerHTML = `
                            <div class="text-center py-12">
                                <i class="fas fa-file-alt text-4xl text-gray-400 mb-3"></i>
                                <p class="text-gray-600">You haven't applied to any jobs yet.</p>
                                <a href="/jobs.html" class="mt-4 text-indigo-600 hover:text-indigo-800 font-medium inline-block">Browse Jobs</a>
                            </div>
                        `;
                    }
                } else {
                    container.innerHTML = `<p class="text-center text-red-600">Error loading applications. Please try again.</p>`;
                }
            } catch (error) {
                console.error('Network error:', error);
                container.innerHTML = `<p class="text-center text-red-600">Network error. Please check your connection.</p>`;
            }
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case 'shortlisted': return 'bg-green-100 text-green-800';
                case 'rejected': return 'bg-red-100 text-red-800';
                case 'hired': return 'bg-blue-100 text-blue-800';
                case 'reviewing': return 'bg-yellow-100 text-yellow-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function getStatusBorderClass(status) {
            switch(status) {
                case 'shortlisted': return 'border-green-500';
                case 'rejected': return 'border-red-500';
                case 'hired': return 'border-blue-500';
                case 'reviewing': return 'border-yellow-500';
                default: return 'border-gray-500';
            }
        }
    </script>
</body>
</html>
