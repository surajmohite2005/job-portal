<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="/public/auth.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthentication().then(user => {
                if (user) {
                    loadProfile(user.user);
                }
            });
        });
    </script>
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-xl sm:text-2xl font-bold text-indigo-600">JobPortal</a>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <a href="/" class="text-gray-700 hover:text-indigo-600 px-2 py-2 rounded-md text-sm font-medium">Home</a>
                    <a href="/dashboard" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Dashboard</a>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800 px-2 py-2 rounded-md text-sm font-medium">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">Edit Profile</h1>
            <p class="text-xl text-gray-600">Update your personal information</p>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-6 max-w-2xl mx-auto">
            <form id="profileForm" class="space-y-6">
                <div>
                    <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" disabled class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-100 cursor-not-allowed">
                    <p class="mt-1 text-xs text-gray-500">Email cannot be changed</p>
                </div>
                <div id="profileMessage" class="hidden mt-4 p-3 rounded-lg"></div>
                <div class="flex justify-end space-x-4">
                    <a href="/dashboard" class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 font-semibold hover:bg-gray-100">Cancel</a>
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-300">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        function loadProfile(user) {
            document.getElementById('fullName').value = user.fullName;
            document.getElementById('email').value = user.email;
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const messageEl = document.getElementById('profileMessage');

            try {
                const csrfToken = await getCsrfToken();
                const response = await fetch('/api/profile/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify({ fullName })
                });

                const result = await response.json();
                if (response.ok) {
                    showMessage(messageEl, 'Profile updated successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showMessage(messageEl, result.message, 'error');
                }
            } catch (error) {
                console.error('Profile update error:', error);
                showMessage(messageEl, 'Network error. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
